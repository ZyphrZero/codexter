name: Desktop Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 只做兼容检查；不访问发布凭据、不更新 Release 或清单。
permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Flutter on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $flutterDir = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git $flutterDir
          "$flutterDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned Flutter on macOS
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build macOS debug app
        if: runner.os == 'macOS'
        run: flutter build macos --debug --no-pub
      - name: Build release app
        run: flutter build ${{ matrix.platform }} --release --no-pub
