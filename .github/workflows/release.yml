name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '正式版本 Tag，例如 v1.0.7，必须与 pubspec.yaml 一致'
        required: true
        type: string
      publish:
        description: '发布 Release（默认只构建；发布时必须已存在对应 Tag）'
        type: boolean
        default: false

# 不取消进行中的发布；跨版本串行，避免旧任务覆盖较新的更新入口。
concurrency:
  group: codexter-release
  cancel-in-progress: false
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      repository: ${{ steps.meta.outputs.repository }}
      manifest_url: ${{ steps.meta.outputs.manifest_url }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          # 手动只构建时验证所选分支；正式发布必须检出对应 Tag，而非分支最新代码。
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - name: Validate version and resolve update source
        id: meta
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY }}
          UPDATE_MANIFEST_URL: ${{ vars.UPDATE_MANIFEST_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)(?:\+\d+)?\s*$' | Select-Object -First 1
          if (-not $line) { throw 'pubspec.yaml 必须使用正式版本号' }
          $version = $line.Matches[0].Groups[1].Value
          if ($env:REQUESTED_TAG -cne "v$version") { throw 'Tag 与 pubspec.yaml 版本不一致' }
          $repo = if ($env:RELEASE_REPOSITORY) { $env:RELEASE_REPOSITORY } else { $env:GITHUB_REPOSITORY }
          if ($repo -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw '发布仓库格式错误' }
          $manifest = if ($env:UPDATE_MANIFEST_URL) { $env:UPDATE_MANIFEST_URL } else { "https://github.com/$repo/releases/latest/download/latest.json" }
          $uri = [uri]$manifest
          if (-not $uri.IsAbsoluteUri -or $uri.Scheme -ne 'https' -or $manifest -match '[\r\n]') { throw '更新源必须为单行 HTTPS 地址' }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw '读取提交失败' }
          @("commit=$commit", "version=$version", "tag=$env:REQUESTED_TAG", "repository=$repo", "manifest_url=$manifest", "publish=$($env:SHOULD_PUBLISH.ToLowerInvariant())") | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Install pinned Flutter
        shell: pwsh
        run: |
          $flutterDir = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git $flutterDir
          if ($LASTEXITCODE -ne 0) { throw '下载 Flutter 失败' }
          "$flutterDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build Windows packages
        shell: pwsh
        env:
          UPDATE_MANIFEST_URL: ${{ needs.prepare.outputs.manifest_url }}
        run: ./scripts/build_windows.ps1 -SkipAnalyze -UpdateManifestUrl $env:UPDATE_MANIFEST_URL
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/Codexter-${{ needs.prepare.outputs.version }}-Setup.exe
            dist/Codexter-${{ needs.prepare.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          overwrite: true

  macos:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Check Apple build tools
        run: |
          xcodebuild -version
          pod --version
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build and verify MacOS Universal package
        env:
          UPDATE_MANIFEST_URL: ${{ needs.prepare.outputs.manifest_url }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/Codexter-${{ needs.prepare.outputs.version }}-macos-universal.zip
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [prepare, windows, macos]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: release-windows
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: release-macos
          path: dist
      - name: Publish complete release from draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          EXTERNAL_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TARGET_REPOSITORY: ${{ needs.prepare.outputs.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ($env:TARGET_REPOSITORY -ne $env:GITHUB_REPOSITORY -and -not $env:EXTERNAL_RELEASE_TOKEN) {
            throw '独立发布仓库需要配置 RELEASE_TOKEN'
          }
          ./scripts/publish_release.ps1 -Version $env:RELEASE_VERSION -Tag $env:RELEASE_TAG -Repository $env:TARGET_REPOSITORY
